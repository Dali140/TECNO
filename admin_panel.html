
<!DOCTYPE html>
<html lang="es">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      padding: 2rem;
    }
    .admin-panel {
      max-width: 1000px;
      margin: auto;
    }
    .logout {
      float: right;
      background: crimson;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #3C0000;
      color: white;
    }
    td button {
      padding: 6px 10px;
      background: #C9846A;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="admin-panel">
    <button class="logout" onclick="cerrarSesion()">Cerrar sesión</button>
    <h1>Bienvenido, administrador</h1>
    <p>Aquí puedes gestionar productos, ventas y más.</p>

    <table id="tablaPedidos">
      <thead>
        <tr>
          <th>Orden</th>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Teléfono</th>
          <th>País</th>
          <th>Notas de fragancias</th>
          <th>PDF</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <h2>Mensajes de Contacto</h2>
    <table id="tablaContactos">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Email</th>
          <th>Fecha</th>
          <th>Comentario</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    function cerrarSesion() {
      localStorage.removeItem("admin");
      window.location.href = "admin_login.html"; // Redirige al login del admin
    }
    window.addEventListener("DOMContentLoaded", () => {
    const admin = JSON.parse(localStorage.getItem("admin"));
    if (!admin || admin.rol !== "admin") {
      alert("Acceso denegado.");
      window.location.href = "admin_login.html";
    }

    
    fetch("php/obtener_contactos.php")
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector("#tablaContactos tbody");
        tbody.innerHTML = "";

        data.forEach(contacto => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${contacto.nombre}</td>
            <td>${contacto.telefono}</td>
            <td>${contacto.email}</td>
            <td>${contacto.fecha}</td>
            <td>${contacto.comentario}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(error => {
        console.error("Error al obtener contactos:", error);
      });


    fetch("php/obtener_pedidos.php")
      .then(res => res.json())
      .then(data => {
        const tbody = document.querySelector("#tablaPedidos tbody");
        tbody.innerHTML = "";

        data.forEach(pedido => {
          // Preparar HTML de las fragancias (si existen)
          let notasHTML = '';
          if (pedido.fragancias) {
            try {
              const fragancias = JSON.parse(pedido.fragancias);
              notasHTML = fragancias.map((f, i) => `
                <div style="margin-bottom: 10px;">
                  <strong>Perfume ${i + 1}</strong><br>
                  - Nombre: ${f.nombre}<br>
                  - Salida: ${f.salida}<br>
                  - Corazón: ${f.corazon}<br>
                  - Fondo: ${f.fondo}
                </div>
              `).join('');
            } catch (e) {
              notasHTML = "<em>Error al leer fragancias</em>";
            }
          } else {
            notasHTML = "<em>No se registraron notas</em>";
          }

          // Crear fila con todos los datos
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>#${pedido.numero_orden}</td>
            <td>${pedido.nombre}</td>
            <td>${pedido.direccion}, ${pedido.ciudad} - ${pedido.departamento}</td>
            <td>${pedido.telefono}</td>
            <td>${pedido.pais}</td>
            <td>${notasHTML}</td>
            <td><button onclick="descargarPDF('${pedido.numero_orden}')">📄 Guía PDF</button></td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(error => {
        console.error("Error al obtener los pedidos:", error);
      });

      
  });
    function descargarPDF(orden) {
      window.open(`php/descargar_guia.php?orden=${orden}`, '_blank');
    }
  </script>
</body>
</html>
