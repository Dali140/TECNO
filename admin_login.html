
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Administrador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    input, button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 1rem;
    }
    #mensaje {
      color: red;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="nombre" placeholder="Nombre de usuario">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="loginAdmin()">Ingresar</button>
    <p id="mensaje"></p>
  </div>

  <script>
    function loginAdmin() {
    const nombre = document.getElementById("nombre").value;
    const contrasena = document.getElementById("password").value;

    const formData = new FormData();
    formData.append("nombre", nombre);
    formData.append("contrasena", contrasena);

    fetch("php/admin_login.php", {
      method: "POST",
      body: formData
    })
    .then(res => res.json())
    .then(data => {
      if (data.success && data.user.rol === "admin") {
        localStorage.setItem("admin", JSON.stringify(data.user));
        window.location.href = "admin_panel.html";
      } else {
        document.getElementById("mensaje").textContent = data.error || "Credenciales incorrectas.";
      }
    })
    .catch(err => {
      document.getElementById("mensaje").textContent = "Error en el servidor.";
    });
  }

    // Redirigir al panel de administración si ya hay un admin logueado
    window.addEventListener("DOMContentLoaded", () => {
      const admin = JSON.parse(localStorage.getItem("admin"));
      if (admin && admin.rol === "admin") {
        window.location.href = "admin_panel.html";
      }
    });
  </script>
</body>
</html>
